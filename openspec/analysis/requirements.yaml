    category: accuracy
    title: 背景分頁計時準確度
    description: 計時 MUST 以時間戳（結束時間）計算剩餘時間，不依賴 tick 累加；分頁背景或裝置睡眠後回到前景，顯示 MUST 於 1 秒內修正。
    metric: "背景 30 分鐘後誤差 ≤ 1s"
