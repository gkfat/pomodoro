    title: 純前端與技術棧一致
    description: 實作 MUST 沿用既有 Vue 3 + TypeScript + Vuetify 4 技術棧，不新增後端或非必要依賴；所有狀態轉換集中於單一計時引擎，UI 元件僅呼叫引擎、不得自行改動倒數時間，以利單元測試。
    metric: "計時引擎有單元測試覆蓋 FR-003、FR-009、NFR-001、NFR-002"
    context: [CTX-CON-001, CTX-CON-004]
