    title: 輸入範圍限制
    description: 時間設定 MUST 限制為 5 分鐘單位、5–120 分鐘；拖曳條本身限制取值，儲存資料讀取時仍須驗證（NFR-003）。
    metric: "可選取值僅為 5 的倍數且介於 5–120 分鐘"
